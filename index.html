<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THRONE CONTROL</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .status {
      text-align: center;
      padding: 10px;
      background: #222;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: #1f9d55;
      color: white;
    }

    .sell {
      background: #d63031;
      color: white;
    }

    .close {
      background: #f39c12;
      color: white;
    }

    .start {
      background: #2980b9;
      color: white;
    }

    .stop {
      background: #555;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>👑 THRONE CONTROL</h1>

  <div class="status">
    MT5 STATUS: 🔴 DISCONNECTED
  </div>

  <label>Trading Symbol</label>
  <input type="text" id="symbol" value="XAUUSD">

  <label>Lot Size</label>
  <input type="number" id="lot" value="0.01" step="0.01">

  <button class="buy" onclick="sendCommand('BUY')">
    🟢 BUY
  </button>

  <button class="sell" onclick="sendCommand('SELL')">
    🔴 SELL
  </button>

  <button class="close" onclick="sendCommand('CLOSE_ALL')">
    ❌ CLOSE ALL
  </button>

  <button class="start" onclick="sendCommand('START_ROBOT')">
    ▶ START ROBOT
  </button>

  <button class="stop" onclick="sendCommand('STOP_ROBOT')">
    ⏹ STOP ROBOT
  </button>

</div>

<script>

function sendCommand(command) {

  const symbol = document.getElementById("symbol").value;

  const lot = document.getElementById("lot").value;

  alert(
    "Command: " + command +
    "\nSymbol: " + symbol +
    "\nLot: " + lot
  );

  // Later this will send commands
  // to our MT5 Bridge.

}

</script>

</body>
  </html>
