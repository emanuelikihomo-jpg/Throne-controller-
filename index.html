<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THRONE CONTROL</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .status {
      text-align: center;
      padding: 12px;
      background: #222;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .connected {
      color: #2ecc71;
    }

    .disconnected {
      color: #e74c3c;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .buy {
      background: #1f9d55;
      color: white;
    }

    .sell {
      background: #d63031;
      color: white;
    }

    .close {
      background: #f39c12;
      color: white;
    }

    .start {
      background: #2980b9;
      color: white;
    }

    .stop {
      background: #555;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>👑 THRONE CONTROL</h1>

  <div class="status disconnected" id="status">
    MT5 STATUS: 🔴 DISCONNECTED
  </div>

  <label>Trading Symbol</label>
  <input type="text" id="symbol" value="XAUUSD">

  <label>Lot Size</label>
  <input type="number" id="lot" value="0.01" step="0.01" min="0.01">

  <button class="buy" onclick="sendCommand('BUY')">
    🟢 BUY
  </button>

  <button class="sell" onclick="sendCommand('SELL')">
    🔴 SELL
  </button>

  <button class="close" onclick="sendCommand('CLOSE_ALL')">
    ❌ CLOSE ALL
  </button>

  <button class="start" onclick="sendCommand('START_ROBOT')">
    ▶ START ROBOT
  </button>

  <button class="stop" onclick="sendCommand('STOP_ROBOT')">
    ⏹ STOP ROBOT
  </button>

</div>

<script>

const API_URL = "https://throne-controller.onrender.com";

async function checkConnection() {

  const status = document.getElementById("status");

  try {

    const response = await fetch(`${API_URL}/status`);

    const data = await response.json();

    status.innerHTML = "MT5 STATUS: 🟡 SERVER ONLINE";
    status.className = "status connected";

    console.log("Server:", data);

  } catch (error) {

    status.innerHTML = "MT5 STATUS: 🔴 SERVER OFFLINE";
    status.className = "status disconnected";

    console.error("Connection error:", error);

  }
}


async function sendCommand(command) {

  const symbol = document.getElementById("symbol").value.trim();

  const lot = Number(document.getElementById("lot").value);

  if (!symbol) {
    alert("Please enter a trading symbol.");
    return;
  }

  if (!lot || lot <= 0) {
    alert("Please enter a valid lot size.");
    return;
  }

  let url = "";
  let body = {};

  if (command === "BUY" || command === "SELL") {

    url = `${API_URL}/order`;

    body = {
      type: command,
      symbol: symbol,
      lot: lot
    };

  }

  else if (command === "CLOSE_ALL") {

    url = `${API_URL}/close-all`;

    body = {};

  }

  else if (command === "START_ROBOT") {

    url = `${API_URL}/robot`;

    body = {
      action: "START"
    };

  }

  else if (command === "STOP_ROBOT") {

    url = `${API_URL}/robot`;

    body = {
      action: "STOP"
    };

  }

  try {

    const response = await fetch(url, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(body)

    });

    const data = await response.json();

    if (data.success) {

      alert(
        "✅ COMMAND SENT\n\n" +
        data.message
      );

    } else {

      alert(
        "⚠️ COMMAND FAILED\n\n" +
        (data.message || "Unknown error")
      );

    }

  } catch (error) {

    alert(
      "❌ CONNECTION FAILED\n\n" +
      "Server haipatikani."
    );

    console.error(error);

  }
}


checkConnection();

</script>

</body>
  </html>
