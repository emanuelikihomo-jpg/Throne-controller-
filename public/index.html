<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Throne Controller</title>  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .login-box, .dashboard {
      background: #1f2937;
      padding: 25px;
      border-radius: 15px;
      margin-top: 40px;
    }

    .dashboard {
      display: none;
    }

    h1, h2 {
      text-align: center;
    }

    .card {
      background: #273449;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn {
      background: #3b82f6;
      color: white;
    }

    .buy {
      background: #22c55e;
      color: white;
    }

    .sell {
      background: #ef4444;
      color: white;
    }

    .close {
      background: #f59e0b;
      color: white;
    }

    .robot {
      background: #6366f1;
      color: white;
    }

    .status {
      text-align: center;
      margin-bottom: 20px;
      color: #22c55e;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      background: #111827;
      border-radius: 8px;
      word-wrap: break-word;
    }
  </style></head><body><div class="container">  <!-- LOGIN -->  <div class="login-box" id="loginBox"><h1>👑 Throne Hub</h1>
<h2>Controller Login</h2>

<label>API Key</label>

<input
  type="password"
  id="apiKeyInput"
  placeholder="Enter your API Key"
>

<button class="login-btn" onclick="login()">
  LOGIN
</button>

<div id="loginResult"></div>

  </div>  <!-- DASHBOARD -->  <div class="dashboard" id="dashboard"><h1>👑 Throne Controller</h1>

<div class="status">
  ● Controller Online
</div>

<div class="card">

  <label>Symbol</label>
  <input id="symbol" value="XAUUSD">

  <label>Lot Size</label>
  <input id="lot" type="number" value="0.01" step="0.01">

  <button class="buy" onclick="sendOrder('BUY')">
    🟢 BUY
  </button>

  <button class="sell" onclick="sendOrder('SELL')">
    🔴 SELL
  </button>

</div>

<div class="card">

  <button class="close" onclick="closeAll()">
    🛑 CLOSE ALL
  </button>

  <button class="robot" onclick="robot('START')">
    ▶️ START ROBOT
  </button>

  <button class="robot" onclick="robot('STOP')">
    ⏹️ STOP ROBOT
  </button>

  <div id="result">
    Waiting for command...
  </div>

</div>

  </div></div><script>

const API_URL = window.location.origin;

let API_KEY = "";


async function login() {

  const key = document.getElementById("apiKeyInput").value;

  if (!key) {
    document.getElementById("loginResult").innerText =
      "Please enter API Key";
    return;
  }

  try {

    const response = await fetch(`${API_URL}/status`, {

      headers: {
        "x-api-key": key
      }

    });

    if (response.ok) {

      API_KEY = key;

      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

    } else {

      document.getElementById("loginResult").innerText =
        "Invalid API Key";

    }

  } catch (error) {

    document.getElementById("loginResult").innerText =
      "Connection error";

  }

}


async function sendOrder(type) {

  const symbol = document.getElementById("symbol").value;

  const lot = Number(
    document.getElementById("lot").value
  );

  const response = await fetch(`${API_URL}/order`, {

    method: "POST",

    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY
    },

    body: JSON.stringify({
      type,
      symbol,
      lot
    })

  });

  const data = await response.json();

  document.getElementById("result").innerText =
    JSON.stringify(data, null, 2);

}


async function closeAll() {

  const response = await fetch(`${API_URL}/close-all`, {

    method: "POST",

    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY
    }

  });

  const data = await response.json();

  document.getElementById("result").innerText =
    JSON.stringify(data, null, 2);

}


async function robot(action) {

  const response = await fetch(`${API_URL}/robot`, {

    method: "POST",

    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY
    },

    body: JSON.stringify({
      action
    })

  });

  const data = await response.json();

  document.getElementById("result").innerText =
    JSON.stringify(data, null, 2);

}

</script></body>
    </html>
