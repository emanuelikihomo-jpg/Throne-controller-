<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Throne Hub</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    .box {
      background: #1f2937;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }

    .login-box {
      margin-top: 60px;
    }

    .dashboard {
      display: none;
    }

    h1, h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: none;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      background: #3b82f6;
      color: white;
    }

    .buy {
      background: #22c55e;
      color: white;
    }

    .sell {
      background: #ef4444;
      color: white;
    }

    .close {
      background: #f59e0b;
      color: white;
    }

    .robot {
      background: #6366f1;
      color: white;
    }

    .refresh {
      background: #374151;
      color: white;
    }

    .start {
      background: #22c55e;
      color: white;
    }

    .stop {
      background: #ef4444;
      color: white;
    }

    .edit {
      background: #3b82f6;
      color: white;
    }

    .delete {
      background: #991b1b;
      color: white;
    }

    .status {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #374151;
    }

    .connected {
      color: #22c55e;
    }

    .disconnected {
      color: #f87171;
    }

    .account-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      background: #273449;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-title {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: bold;
    }

    .robot-card {
      background: #273449;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .robot-name {
      font-size: 18px;
      font-weight: bold;
    }

    .robot-info {
      color: #9ca3af;
      margin: 7px 0;
      font-size: 14px;
    }

    .running {
      color: #22c55e;
      font-weight: bold;
    }

    .stopped {
      color: #f87171;
      font-weight: bold;
    }

    .form-title {
      margin-top: 20px;
      text-align: center;
    }

    #addRobotForm {
      display: none;
      background: #273449;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      background: #111827;
      border-radius: 8px;
      word-wrap: break-word;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div class="box login-box" id="loginBox">

    <h1>👑 Throne Hub</h1>

    <h2>Controller Login</h2>

    <label>API Key</label>

    <input
      type="password"
      id="apiKeyInput"
      placeholder="Enter your API Key"
    >

    <button class="login" onclick="login()">
      LOGIN
    </button>

    <div id="loginResult"></div>

  </div>


  <!-- DASHBOARD -->

  <div class="dashboard" id="dashboard">

    <h1>👑 Throne Hub</h1>


    <!-- MT5 STATUS -->

    <div class="box">

      <h2>MT5 Connection</h2>

      <div class="status disconnected" id="mt5Status">
        🔴 MT5 Disconnected
      </div>

      <button class="refresh" onclick="refreshStatus()">
        🔄 Refresh Status
      </button>

    </div>


    <!-- ACCOUNT -->

    <div class="box">

      <h2>📊 Account Overview</h2>

      <div class="account-grid">

        <div class="stat">
          <div class="stat-title">Balance</div>
          <div class="stat-value" id="balance">--</div>
        </div>

        <div class="stat">
          <div class="stat-title">Equity</div>
          <div class="stat-value" id="equity">--</div>
        </div>

        <div class="stat">
          <div class="stat-title">Floating P/L</div>
          <div class="stat-value" id="floatingPL">--</div>
        </div>

        <div class="stat">
          <div class="stat-title">Open Trades</div>
          <div class="stat-value" id="openTrades">0</div>
        </div>

      </div>

    </div>


    <!-- MY ROBOTS -->

    <div class="box">

      <h2>🤖 MY ROBOTS</h2>

      <div id="robotsContainer">
        Loading robots...
      </div>


      <!-- ADD ROBOT BUTTON -->

      <button class="robot" onclick="showAddRobot()">
        ➕ ADD ROBOT
      </button>


      <!-- ADD ROBOT FORM -->

      <div id="addRobotForm">

        <h3 class="form-title">
          Add New Robot
        </h3>

        <label>Robot Name</label>

        <input
          id="robotName"
          placeholder="Example: Gold Master 5"
        >


        <label>Symbol</label>

        <input
          id="robotSymbol"
          value="XAUUSD"
          placeholder="Example: XAUUSD"
        >


        <label>Magic Number</label>

        <input
          id="robotMagic"
          type="number"
          placeholder="Example: 10004"
        >


        <label>Lot Size</label>

        <input
          id="robotLot"
          type="number"
          value="0.01"
          step="0.01"
        >


        <button class="start" onclick="addRobot()">
          ✅ SAVE ROBOT
        </button>


        <button class="stop" onclick="hideAddRobot()">
          ❌ CANCEL
        </button>

      </div>

    </div>


    <!-- MANUAL TRADING -->

    <div class="box">

      <h2>📈 Manual Trading</h2>

      <label>Symbol</label>

      <input
        id="symbol"
        value="XAUUSD"
      >

      <label>Lot Size</label>

      <input
        id="lot"
        type="number"
        value="0.01"
        step="0.01"
      >

      <button class="buy" onclick="sendOrder('BUY')">
        🟢 BUY
      </button>

      <button class="sell" onclick="sendOrder('SELL')">
        🔴 SELL
      </button>

    </div>


    <!-- CONTROLS -->

    <div class="box">

      <h2>⚙️ Controls</h2>

      <button class="close" onclick="closeAll()">
        🛑 CLOSE ALL
      </button>

      <button class="robot" onclick="robot('START')">
        ▶️ START ROBOT
      </button>

      <button class="robot" onclick="robot('STOP')">
        ⏹️ STOP ROBOT
      </button>

      <div id="result">
        Waiting for command...
      </div>

    </div>

  </div>

</div>


<script>

const API_URL = window.location.origin;

let API_KEY = "";


/* ===============================
   LOGIN
================================ */

async function login() {

  const key =
    document.getElementById("apiKeyInput").value.trim();

  if (!key) {

    document.getElementById("loginResult").innerText =
      "Please enter API Key";

    return;
  }

  try {

    const response = await fetch(
      `${API_URL}/status`,
      {
        headers: {
          "x-api-key": key
        }
      }
    );

    if (response.ok) {

      API_KEY = key;

      document.getElementById("loginBox")
        .style.display = "none";

      document.getElementById("dashboard")
        .style.display = "block";

      refreshStatus();

      loadRobots();

    } else {

      document.getElementById("loginResult").innerText =
        "Invalid API Key";

    }

  } catch (error) {

    document.getElementById("loginResult").innerText =
      "Connection error";

  }

}


/* ===============================
   MT5 STATUS
================================ */

async function refreshStatus() {

  try {

    const response = await fetch(
      `${API_URL}/status`,
      {
        headers: {
          "x-api-key": API_KEY
        }
      }
    );

    const data = await response.json();

    const status =
      document.getElementById("mt5Status");

    if (data.mt5 === "connected") {

      status.innerText =
        "🟢 MT5 Connected";

      status.className =
        "status connected";

    } else {

      status.innerText =
        "🔴 MT5 Disconnected";

      status.className =
        "status disconnected";

    }

  } catch (error) {

    document.getElementById("mt5Status").innerText =
      "⚠️ Connection Error";

  }

}


/* ===============================
   LOAD ROBOTS
================================ */

async function loadRobots() {

  try {

    const response = await fetch(
      `${API_URL}/robots`,
      {
        headers: {
          "x-api-key": API_KEY
        }
      }
    );

    const data = await response.json();

    const container =
      document.getElementById("robotsContainer");

    container.innerHTML = "";

    if (!data.robots || data.robots.length === 0) {

      container.innerHTML =
        "No robots available.";

      return;
    }


    data.robots.forEach(robot => {

      const card =
        document.createElement("div");

      card.className = "robot-card";


      const statusClass =
        robot.status === "RUNNING"
          ? "running"
          : "stopped";


      const statusIcon =
        robot.status === "RUNNING"
          ? "🟢"
          : "🔴";


      const action =
        robot.status === "RUNNING"
          ? "STOP"
          : "START";


      const buttonClass =
        robot.status === "RUNNING"
          ? "stop"
          : "start";


      card.innerHTML = `

        <div class="robot-name">
          🤖 ${escapeHTML(robot.name)}
        </div>

        <div class="robot-info">
          Symbol: ${escapeHTML(robot.symbol)}
        </div>

        <div class="robot-info">
          Magic Number: ${robot.magicNumber}
        </div>

        <div class="${statusClass}">
          ${statusIcon} ${robot.status}
        </div>

        <div class="robot-info">
          Lot: ${robot.lot}
        </div>

        <div class="robot-info">
          P/L: $${robot.profit}
        </div>

        <div class="robot-info">
          Trades: ${robot.trades}
        </div>

        <button
          class="${buttonClass}"
          onclick="controlRobot(${robot.id}, '${action}')"
        >
          ${action === "START" ? "▶️ START" : "⏹️ STOP"}
        </button>

        <button
          class="edit"
          onclick="editRobot(${robot.id})"
        >
          ✏️ EDIT
        </button>

        <button
          class="delete"
          onclick="deleteRobot(${robot.id})"
        >
          🗑️ DELETE
        </button>

      `;

      container.appendChild(card);

    });

  } catch (error) {

    document.getElementById("robotsContainer").innerText =
      "Unable to load robots.";

  }

}


/* ===============================
   SHOW ADD ROBOT
================================ */

function showAddRobot() {

  document.getElementById("addRobotForm")
    .style.display = "block";

}


/* ===============================
   HIDE ADD ROBOT
================================ */

function hideAddRobot() {

  document.getElementById("addRobotForm")
    .style.display = "none";

}


/* ===============================
   ADD ROBOT
================================ */

async function addRobot() {

  const name =
    document.getElementById("robotName")
      .value.trim();

  const symbol =
    document.getElementById("robotSymbol")
      .value.trim();

  const magicNumber =
    Number(
      document.getElementById("robotMagic")
        .value
    );

  const lot =
    Number(
      document.getElementById("robotLot")
        .value
    );


  if (!name || !symbol || !magicNumber || !lot) {

    document.getElementById("result").innerText =
      "Please fill all robot fields.";

    return;
  }


  try {

    const response = await fetch(
      `${API_URL}/robots`,
      {

        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-api-key": API_KEY
        },

        body: JSON.stringify({

          name,
          symbol,
          magicNumber,
          lot

        })

      }
    );


    const data =
      await response.json();


    document.getElementById("result").innerText =
      data.message;


    if (data.success) {

      document.getElementById("robotName").value = "";

      document.getElementById("robotSymbol").value = "XAUUSD";

      document.getElementById("robotMagic").value = "";

      document.getElementById("robotLot").value = "0.01";

      hideAddRobot();

      loadRobots();

    }

  } catch (error) {

    document.getElementById("result").innerText =
      "Connection error";

  }

}


/* ===============================
   CONTROL ROBOT
================================ */

async function controlRobot(id, action) {

  try {

    const response = await fetch(
      `${API_URL}/robots/${id}`,
      {

        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-api-key": API_KEY
        },

        body: JSON.stringify({
          action
        })

      }
    );


    const data =
      await response.json();


    document.getElementById("result").innerText =
      data.message;


    loadRobots();

  } catch (error) {

    document.getElementById("result").innerText =
      "Connection error";

  }

}


/* ===============================
   EDIT ROBOT
================================ */

async function editRobot(id) {

  try {

    const response = await fetch(
      `${API_URL}/robots`,
      {
        headers: {
          "x-api-key": API_KEY
        }
      }
    );

    const data = await response.json();

    const robot =
      data.robots.find(r => r.id === id);

    if (!robot) {

      document.getElementById("result").innerText =
        "Robot not found.";

      return;

    }


    const name =
      prompt("Robot Name:", robot.name);

    if (name === null) return;


    const symbol =
      prompt("Symbol:", robot.symbol);

    if (symbol === null) return;


    const magicNumber =
      prompt(
        "Magic Number:",
        robot.magicNumber
      );

    if (magicNumber === null) return;


    const lot =
      prompt(
        "Lot Size:",
        robot.lot
      );

    if (lot === null) return;


    const updateResponse =
      await fetch(
        `${API_URL}/robots/${id}`,
        {

          method: "PUT",

          headers: {
            "Content-Type": "application/json",
            "x-api-key": API_KEY
          },

          body: JSON.stringify({

            name,
            symbol,
            magicNumber: Number(magicNumber),
            lot: Number(lot)

          })

        }
      );


    const result =
      await updateResponse.json();


    document.getElementById("result").innerText =
      result.message;


    loadRobots();

  } catch (error) {

    document.getElementById("result").innerText =
      "Connection error";

  }

}


/* ===============================
   DELETE ROBOT
================================ */

async function deleteRobot(id) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this robot?"
    );

  if (!confirmed) return;


  try {

    const response =
      await fetch(
        `${API_URL}/robots/${id}`,
        {

          method: "DELETE",

          headers: {
            "x-api-key": API_KEY
          }

        }
      );


    const data =
      await response.json();


    document.getElementById("result").innerText =
      data.message;


    loadRobots();

  } catch (error) {

    document.getElementById("result").innerText =
      "Connection error";

  }

}


/* ===============================
   BUY / SELL
================================ */

async function sendOrder(type) {

  const symbol =
    document.getElementById("symbol").value;

  const lot =
    Number(
      document.getElementById("lot").value
    );


  try {

    const response =
      await fetch(
        `${API_URL}/order`,
        {

          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "x-api-key": API_KEY
          },

          body: JSON.stringify({

            type,
            symbol,
            lot

          })

        }
      );


    const data =
      await response.json();


    document.getElementById("result").innerText =
      JSON.stringify(data, null, 2);

  } catch (error) {

    document.getElementById("result").innerText =
      "Connection error";

  }

}


/* ===============================
   CLOSE ALL
================================ */

async function closeAll() {

  try {

    const response =
      await fetch(
        `${API_URL}/close-all`,
        {

          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "x-api-key": API_KEY
          }

        }
      );


    const data =
      await response.json();


    document.getElementById("result").innerText =
      JSON.stringify(data, null, 2);

  } catch (error) {

    document.getElementById("result").innerText =
      "Connection error";

  }

}


/* ===============================
   GENERAL ROBOT CONTROL
================================ */

async function robot(action) {

  try {

    const response =
      await fetch(
        `${API_URL}/robot`,
        {

          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "x-api-key": API_KEY
          },

          body: JSON.stringify({
            action
          })

        }
      );


    const data =
      await response.json();


    document.getElementById("result").innerText =
      JSON.stringify(data, null, 2);

  } catch (error) {

    document.getElementById("result").innerText =
      "Connection error";

  }

}


/* ===============================
   SECURITY HELPER
================================ */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
        </html>
